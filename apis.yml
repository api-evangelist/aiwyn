aid: aiwyn
name: Aiwyn
description: >-
  Aiwyn is a practice-automation platform built for modern accounting and CPA
  firms, unifying payments, practice management, client experience, and tax into
  a single relationship-centered system. Aiwyn Payments automates invoicing,
  card and ACH collection, and reconciliation; Aiwyn Practice covers time,
  billing, project management and resource planning; Aiwyn Experience delivers a
  unified client portal for engagement letters and secure document exchange; and
  Aiwyn Tax adds AI-assisted tax preparation. The company serves 800+ firms and
  raised $113M from KKR and Bessemer Venture Partners. This profile was surfaced
  as a Bessemer portfolio company; Aiwyn publishes no public developer API,
  OpenAPI, or SDK surface at this time, so enrichment is limited to identity,
  its published llms.txt, and probed domain security.
